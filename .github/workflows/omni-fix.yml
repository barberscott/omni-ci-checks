name: Omni Fix

# Selective fixer: comment `/omni-fix <selectors>` on a PR to have Claude
# generate corrected model YAML for chosen best-practices findings and commit
# it to the branch THROUGH OMNI (never a direct git write).
#
# Selectors: 1.1 · 3.3-3.5 · 2.* · errors|warnings|infos · rule:<id> · all
#
# Generate-then-apply: Claude only produces corrected YAML (no write tools);
# this workflow applies it via `omni models yaml-create` + validate + commit.
# Pre-flight + a late-bind re-check gate ensure we never write while Omni
# Checks are in flight, and cancel cleanly if checks start mid-run.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read      # list workflow runs for the in-flight gate
  id-token: write    # claude-code-action OIDC

concurrency:
  group: omni-fix-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  omni-fix:
    # Only PR comments, only the command, only write-access commenters.
    if: >
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/omni-fix') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      MODEL_ID: ${{ vars.OMNI_MODEL_ID }}
      # Directory the Omni git integration writes model YAML into (used to map
      # repo paths to Omni model filenames). Omni's default modelPath is
      # `omni/<model name>`; set the OMNI_MODEL_DIR variable to override.
      OMNI_MODEL_DIR: ${{ vars.OMNI_MODEL_DIR || 'omni' }}
    steps:
      - name: Acknowledge
        run: |
          gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null || true
          mkdir -p /tmp/omni-fix

      - name: Require Claude token
        env:
          HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_CLAUDE" != "true" ]; then
            printf '## /omni-fix\n\n❌ The `CLAUDE_CODE_OAUTH_TOKEN` secret is not configured, so the fix generator cannot run. See the setup docs in the README.\n' > /tmp/omni-fix/result.md
            exit 1
          fi

      - uses: actions/checkout@v6

      - name: Resolve PR
        id: pr
        run: |
          set -euo pipefail
          json=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          echo "head_ref=$(echo "$json" | jq -r .head.ref)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(echo "$json" | jq -r .head.sha)" >> "$GITHUB_OUTPUT"

      - name: Pre-flight — no checks in flight
        run: |
          set -euo pipefail
          active=$(gh api "repos/$REPO/actions/runs?head_sha=${{ steps.pr.outputs.head_sha }}&per_page=100" \
            --jq '[.workflow_runs[] | select(.name=="Omni Checks" and .status!="completed")] | length')
          if [ "$active" -gt 0 ]; then
            printf '## /omni-fix\n\n🚧 Skipped — %s Omni Checks run(s) are still in flight on this commit. Re-run `/omni-fix` once they finish.\n' "$active" > /tmp/omni-fix/result.md
            exit 1
          fi

      - name: Setup Omni CLI
        uses: ./.github/actions/setup-omni-cli
        with:
          base-url: ${{ vars.OMNI_BASE_URL }}
          token: ${{ secrets.OMNI_TOKEN }}

      - name: Resolve Omni branch
        id: branch
        env:
          OMNI_MODEL_ID: ${{ vars.OMNI_MODEL_ID }}
          GIT_REF: ${{ steps.pr.outputs.head_ref }}
        run: .github/scripts/resolve-omni-branch.sh

      - name: Checkout skills
        uses: actions/checkout@v6
        with:
          repository: exploreomni/omni-agent-skills
          # Tracks main by default; set the OMNI_SKILLS_SHA repository
          # variable to pin against a specific skills revision.
          ref: ${{ vars.OMNI_SKILLS_SHA || 'main' }}
          path: skills-src
          sparse-checkout: |
            skills/omni-model-builder
            skills/omni-ai-optimizer
          sparse-checkout-cone-mode: false

      - name: Select findings
        run: |
          set -euo pipefail
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate > /tmp/omni-fix/comments.json
          SEL="${COMMENT_BODY#*/omni-fix}"
          python3 .github/scripts/select-findings.py \
            --comments /tmp/omni-fix/comments.json \
            --selection "$SEL" \
            --current-sha "${{ steps.pr.outputs.head_sha }}" \
            --out /tmp/omni-fix/selected.json \
            --report /tmp/omni-fix/result.md

      - name: Build fix input (read-only yaml-get)
        run: |
          set -euo pipefail
          python3 .github/scripts/build-fix-input.py \
            --selected /tmp/omni-fix/selected.json \
            --model-id "$MODEL_ID" \
            --branch-id "${{ steps.branch.outputs.branch_id }}" \
            --out /tmp/omni-fix/fix-input.json \
          || { printf '## /omni-fix\n\n❌ Could not read current YAML for the selected files from the Omni branch.\n' > /tmp/omni-fix/result.md; exit 1; }

      - name: Build generation prompt
        id: prompt
        run: |
          set -euo pipefail
          {
            cat .github/prompts/omni-fix-apply.md
            echo
            echo "## Files you may Read"
            echo
            echo "Best practices — the full Omni agent skills (READ FIRST):"
            echo "- skills-src/skills/omni-model-builder/SKILL.md"
            echo "- skills-src/skills/omni-model-builder/references/modelParameters.md"
            echo "- skills-src/skills/omni-model-builder/references/yaml-filter-syntax.md"
            echo "- skills-src/skills/omni-model-builder/references/topic-scoped-views.md"
            echo "- skills-src/skills/omni-model-builder/references/topic-scoped-relationships.md"
            echo "- skills-src/skills/omni-model-builder/references/query-view-examples.md"
            echo "- skills-src/skills/omni-ai-optimizer/SKILL.md"
            echo
            echo "## fix-input.json (the files + the findings to fix)"
            echo
            echo '```json'
            cat /tmp/omni-fix/fix-input.json
            echo '```'
            echo
            echo "Do not Read any other path. Final message = the JSON document only."
          } > /tmp/omni-fix/prompt.md
          {
            echo "prompt<<OMNIFIXEOF"
            cat /tmp/omni-fix/prompt.md
            echo "OMNIFIXEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate corrected YAML (Claude, no write tools)
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          show_full_output: true
          track_progress: false
          claude_args: |
            --allowedTools Read
            --max-turns 15

      - name: Re-check gate (late-bind cancel)
        run: |
          set -euo pipefail
          cur=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          if [ "$cur" != "${{ steps.pr.outputs.head_sha }}" ]; then
            printf '## /omni-fix\n\n🚫 Canceled — the branch moved (`%s`) while preparing the fix. **Nothing was written.** Re-run after the new checks settle.\n' "${cur:0:7}" > /tmp/omni-fix/result.md
            exit 1
          fi
          active=$(gh api "repos/$REPO/actions/runs?head_sha=$cur&per_page=100" \
            --jq '[.workflow_runs[] | select(.name=="Omni Checks" and .status!="completed")] | length')
          if [ "$active" -gt 0 ]; then
            printf '## /omni-fix\n\n🚫 Canceled — Omni Checks started while preparing the fix. **Nothing was written.** Re-run once idle.\n' > /tmp/omni-fix/result.md
            exit 1
          fi

      - name: Apply + validate + commit (Omni only)
        id: apply
        run: |
          set +e
          python3 .github/scripts/apply-omni-fix.py \
            --execution-file '${{ steps.claude.outputs.execution_file }}' \
            --structured-output '${{ steps.claude.outputs.structured_output }}' \
            --fix-input /tmp/omni-fix/fix-input.json \
            --model-id "$MODEL_ID" \
            --branch-id "${{ steps.branch.outputs.branch_id }}" \
            --summary-md /tmp/omni-fix/summary.md
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Post result + reaction
        if: always()
        run: |
          set +e
          FILE=/tmp/omni-fix/summary.md
          [ -f "$FILE" ] || FILE=/tmp/omni-fix/result.md
          if [ -f "$FILE" ]; then
            gh pr comment "$PR_NUMBER" --body-file "$FILE" || true
          fi
          REACT="+1"
          if [ ! -f /tmp/omni-fix/summary.md ] || [ "${{ steps.apply.outputs.rc }}" != "0" ]; then REACT="-1"; fi
          gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content="$REACT" >/dev/null || true
